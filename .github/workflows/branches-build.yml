name: "Builds"

# Changed in Omaha: never publish a rolling "dev" GitHub Release.
# Versioned artifacts ship only via tags-publish-release.yml (v*.*.*).
# This workflow still builds on pushes/PRs for compile validation; artifacts
# stay on the workflow run (not attached to a Releases page tag).

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-all:
   uses: ./.github/workflows/shared-build.yml
   with:
      environment: 'testing'
